name: CI

on:
  push:
    branches: [main]
    tags: ['v*']     # v3.4.5（4A）：tag 推送触发 release job 打包发行
  pull_request:

jobs:
  test:
    name: 回归测试 + Release 构建
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 显示工具链
        run: swift --version

      # v3.4.1 真实契约：不用 `| tee` 管道（bash 默认取管道右侧退出码，
      # swift test 失败时 tee 成功 → 假绿 → 徽章照样发 success）。
      # 直接运行 swift test：失败时本步骤退出码非 0，后续所有步骤不执行。
      - name: 运行回归测试（失败即中断）
        run: swift run -c release --disable-sandbox fanctltests

      # 断言数提取 + 契约下限：再跑一次（全绿状态下很快，增量缓存），
      # 断言数低于下限 = 有测试被删/跳过 → 红灯，徽章不发 success。
      # v3.6.1 修复：此步骤原无 pipefail（v3.4.1 的假绿修复漏掉了这里），
      # 且正则会匹配失败行 "❌ X/Y 项断言失败" 里的 Y——重跑 flaky 失败时
      # 吞掉退出码还能提取出达标数字发绿徽章。现 pipefail + 锚定成功行。
      - name: 提取断言数（契约下限校验）
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -o pipefail
          swift run -c release --disable-sandbox fanctltests 2>&1 | tee test-output.txt
          N=$(grep -oE '全部通过：[0-9]+ 项断言' test-output.txt | grep -oE '[0-9]+' | head -1)
          echo "断言数: $N"
          if [ -z "$N" ] || [ "$N" -lt 4870 ]; then
            echo "::error::断言数 $N 低于契约下限 4870（测试被删/跳过？）"
            exit 1
          fi
          echo "ASSERTIONS=$N" >> "$GITHUB_ENV"

      - name: 更新断言数徽章
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          N="${ASSERTIONS:?断言数缺失}"
          mkdir -p .github/badges
          jq -n --arg n "$N" '{schemaVersion: 1, label: "tests", message: ($n + " assertions"), color: "success"}' > .github/badges/tests.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/tests.json
          git diff --cached --quiet || git commit -m "CI: 更新断言数徽章 ($N)"
          git push

      - name: Release 构建
        # R23（P2）：daemon/工具用非 UI 目标直编。App 目标（FanCtlApp）单独一步编译校验
        # （R23 续轮 P3-3：不跑、只编——恢复 PR 阶段对 SelfUpgradeService/FanModel/视图的
        # 编译覆盖，此前只编非 UI 目标会让 App 侧语法/类型回归漏到 tag 触发的 release job
        # 才暴露）。macos runner 始终带完整 Xcode，SwiftUIMacros 插件在场，App 可编。
        run: |
          swift build -c release --disable-sandbox --product fanctld
          swift build -c release --disable-sandbox --product fanprobe
      - name: App 目标编译校验（不跑，仅编）
        run: swift build -c release --disable-sandbox --product FanCtlApp

  # v3.4.5（4A）：tag 推送时打包 dist/ 附到 GitHub Release——访客不必自备
  # Swift 工具链源码编译（第一公里）。产物含 daemon 二进制 + 完整 App bundle +
  # install/uninstall 脚本，按 tag 命名（如 FanCtl-v3.5.0.zip）。
  release:
    name: 打包 Release 附件
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 运行回归测试（tag 也必须全绿才发版）
        run: swift run -c release --disable-sandbox fanctltests

      - name: 发行身份断言（R23：tag == VERSION 主版本）
        # 资产名/Info.plist 由 VERSION 驱动、下载 URL 由 tag 驱动（SelfUpgrade.assetURL）——
        # 两者解耦漂移 = 老用户"检查更新"命中后 404/versionMismatch，全体静默断链
        run: |
          V=$(head -1 VERSION | awk '{print $1}')
          if [ "v${V}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} ≠ VERSION v${V}（打 tag 忘了 bump，或 bump 忘了同步 tag）"
            exit 1
          fi

      - name: 打包（build.sh 从 VERSION 读取版本并组装 App bundle）
        run: ./scripts/build.sh

      - name: 收集发行物
        run: |
          VERSION=$(head -1 VERSION | awk '{print $1}')
          STAGE="FanCtl-${VERSION}"
          mkdir -p "$STAGE"
          cp -R dist/FanCtl.app "$STAGE/"
          cp dist/fanctld "$STAGE/"
          cp dist/fanprobe "$STAGE/"
          cp scripts/install.sh "$STAGE/"
          cp scripts/uninstall.sh "$STAGE/"
          # 批次 A：root 执行脚本随发行物分发——install.sh 把它装进
          # /usr/local/libexec（root:wheel 755），App 只 exec、不携带副本
          cp scripts/upgrade.sh "$STAGE/"
          zip -qr "FanCtl-v${VERSION}.zip" "$STAGE"
          echo "ASSET=FanCtl-v${VERSION}.zip" >> "$GITHUB_ENV"

      - name: 发布 GitHub Release（gh CLI，第一方工具）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 发行说明取自仓库内 RELEASE-NOTES.md（R37：tag 批注在 CI 上不可靠——
          # actions/checkout 检出 tag 建的是 lightweight 引用，git tag -l --format='%(contents)'
          # 会退化成 commit message，v4.2.1 实测丢了迁移警示）。文件随代码评审、可被静态门检查。
          # 发版号必须严格大于已发布的最大 tag（R39 审查轮）：其余几道门比的都是
          # "tag == VERSION == notes 里的号"，三处一起留旧号（改了代码没提号）时全绿——
          # 只有"新代码贴旧版本号"这条路径没人挡。gh 也拦不住删掉 Release 后重打同号。
          CUR_TAG="$GITHUB_REF_NAME"
          PREV_TAG=$(git ls-remote --tags origin 2>/dev/null | sed 's@.*refs/tags/@@; s@\^{}$@@'
            | grep -E '^v[0-9]' | awk -v t="$CUR_TAG" '$0 != t' | sort -V | tail -1)
          if [[ -n "$PREV_TAG" ]] && [[ "$(printf '%s\n%s\n' "$PREV_TAG" "$CUR_TAG" | sort -V | head -1)" == "$CUR_TAG" ]]; then
            echo "::error::tag ${CUR_TAG} 不高于已发布的 ${PREV_TAG}（新代码贴旧版本号 = 同号不同码）"
            exit 1
          fi
          # 说明与 tag 必须同源：notes 是仓库里的固定文件，发版只改 VERSION 而忘了改说明
          # 就会把"上一版的迁移警示"贴到新版本上（这条链上唯一没人复核的一环，故设硬门）
          # 只认"要点行"（- <版本>：），全文匹配会被上一版的警示句蒙过——同号不同
          # build 重发时照样绿，而贴出去的是旧说明
          TAG_V="${GITHUB_REF_NAME#v}"
          TAG_RE=${TAG_V//./\\.}
          if ! grep -qE "^- ${TAG_RE}[：:]" RELEASE-NOTES.md; then
            echo "::error::RELEASE-NOTES.md 缺要点行 - ${TAG_V}：（说明与 tag 不同源，拒绝发布）"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$ASSET" \
            --title "清风 $GITHUB_REF_NAME" \
            --notes-file RELEASE-NOTES.md
