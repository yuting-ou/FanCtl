name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 回归测试（2415 断言）+ Release 构建
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 显示工具链
        run: swift --version

      - name: 运行回归测试（失败即中断）
        run: swift run -c release --disable-sandbox fanctltests

      - name: Release 构建
        run: swift build -c release --disable-sandbox
