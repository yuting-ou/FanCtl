name: CI

on:
  push:
    branches: [main]
    tags: ['v*']     # v3.4.5（4A）：tag 推送触发 release job 打包发行
  pull_request:

jobs:
  test:
    name: 回归测试 + Release 构建
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 显示工具链
        run: swift --version

      # v3.4.1 真实契约：不用 `| tee` 管道（bash 默认取管道右侧退出码，
      # swift test 失败时 tee 成功 → 假绿 → 徽章照样发 success）。
      # 直接运行 swift test：失败时本步骤退出码非 0，后续所有步骤不执行。
      - name: 运行回归测试（失败即中断）
        run: swift run -c release --disable-sandbox fanctltests

      # 断言数提取 + 契约下限：再跑一次（全绿状态下很快，增量缓存），
      # 断言数低于下限 = 有测试被删/跳过 → 红灯，徽章不发 success。
      # v3.6.1 修复：此步骤原无 pipefail（v3.4.1 的假绿修复漏掉了这里），
      # 且正则会匹配失败行 "❌ X/Y 项断言失败" 里的 Y——重跑 flaky 失败时
      # 吞掉退出码还能提取出达标数字发绿徽章。现 pipefail + 锚定成功行。
      - name: 提取断言数（契约下限校验）
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -o pipefail
          swift run -c release --disable-sandbox fanctltests 2>&1 | tee test-output.txt
          N=$(grep -oE '全部通过：[0-9]+ 项断言' test-output.txt | grep -oE '[0-9]+' | head -1)
          echo "断言数: $N"
          if [ -z "$N" ] || [ "$N" -lt 4970 ]; then
            echo "::error::断言数 $N 低于契约下限 4970（测试被删/跳过？）"
            exit 1
          fi
          echo "ASSERTIONS=$N" >> "$GITHUB_ENV"

      - name: 更新断言数徽章
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          N="${ASSERTIONS:?断言数缺失}"
          mkdir -p .github/badges
          jq -n --arg n "$N" '{schemaVersion: 1, label: "tests", message: ($n + " assertions"), color: "success"}' > .github/badges/tests.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/tests.json
          git diff --cached --quiet || git commit -m "CI: 更新断言数徽章 ($N)"
          # R48：徽章提交常与紧邻的人工推送相撞（non-fast-forward），旧写法一次相撞就把
          # 整个作业判红——那红是 CI 自己撞车，不是代码回归。改为 fetch+rebase 重试 3 次，
          # 仍失败才判红并留话。**绝不 --force**（徽章提交是纯追加，rebase 后必可快进）。
          _pushed=0
          for _try in 1 2 3; do
            if git push; then _pushed=1; break; fi
            # 裸 fetch 在 Actions 默认 bash -e 下抖一次就让整步无提示中止
            # （徽章没推、也没有 ::error:: 线索）——正是"撞车被判成回归"的另一种形态
            git fetch -q origin || true
            git rebase origin/main || git rebase --abort || true
            sleep $((_try * 4))
          done
          if [ "$_pushed" != "1" ]; then
            echo "::error::徽章提交重试 3 次仍推不上去（多半是 main 上有真冲突）——需要人工看"
            exit 1
          fi

      # R42：首装/卸载冒烟——"任何人机器上装得起来吗"此前只靠读代码推断。runner 是一台
      # 干净的异机（无风扇 VM ⇒ 走 4.0 B1 的 passive 语义），装它一次就有实证。
      # 只在 main 推送上跑，**绝不在 tag 触发的发版跑里执行**：这道步自己若不可靠，
      # 代价是一次红的 main 推送，而不是一个发不出去的 Release（R39 的教训）。
      - name: 首装与卸载冒烟（干净机器真装真卸，仅 main 推送）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          read -r APP_VERSION BUILD_NUMBER < VERSION
          # 目录信任门是生产语义，不是 CI 的环境抱怨：Homebrew 机器 /usr/local 常归登录用户，
          # 冒烟前按 install.sh 自己要求的样子摆正，再验"合规机器上装得起来"
          sudo mkdir -p /usr/local/libexec
          sudo chown root:wheel /usr/local /usr/local/libexec
          sudo chmod 755 /usr/local /usr/local/libexec
          # 本作业的 "Release 构建" 只直编两个非 UI 目标、不组装 dist/（dist/ 与 App bundle
          # 在 tag 才跑的 release 作业里生成）→ 冒烟必须自己走一遍 build.sh。顺带这也是
          # "干净机器上从零构建出发能不能装起来"的第一公里实证。
          ./scripts/build.sh
          sudo ./scripts/install.sh
          test -x /usr/local/libexec/fanctld || { echo "::error::fanctld 未就位"; exit 1; }
          /usr/local/libexec/fanctld -v | grep -qF "$APP_VERSION ($BUILD_NUMBER)"
          test -d "/Applications/清风.app/Contents/MacOS"
          test -x /usr/local/bin/fanprobe
          sleep 5
          launchctl print system/com.fanctl.daemon >/dev/null
          # 诊断包小节数是固定的 19 行（缺数据也必须出声），干净机器首装后必须能整段产出
          [ "$(sudo /usr/local/bin/fanprobe --report | wc -l | tr -d ' ')" = "19" ]
          sudo /usr/local/libexec/fanctl-uninstall.sh || sudo ./scripts/uninstall.sh
          test ! -e /usr/local/libexec/fanctld
          test ! -e /Library/LaunchDaemons/com.fanctl.daemon.plist
          test ! -e "/Applications/清风.app"
          # 第二公里：访客拿到的不是仓库而是 zip —— R33 为 zip 布局改过产物根查找，
          # 但从没有真按"解压 → sudo ./install.sh"走过一遍。这里现造一个与 release job
          # 同形状的 zip，解到仓库外再装再卸。
          STG="$RUNNER_TEMP/StageLayout/FanCtl-${APP_VERSION}"
          mkdir -p "$STG"
          cp -R dist/FanCtl.app dist/fanctld dist/fanprobe scripts/install.sh scripts/uninstall.sh scripts/upgrade.sh "$STG/"
          (cd "$RUNNER_TEMP/StageLayout" && zip -qr ../visitor.zip "FanCtl-${APP_VERSION}")
          mkdir -p "$RUNNER_TEMP/visitor" && unzip -q "$RUNNER_TEMP/visitor.zip" -d "$RUNNER_TEMP/visitor"
          (cd "$RUNNER_TEMP/visitor/FanCtl-${APP_VERSION}" && sudo ./install.sh)
          /usr/local/libexec/fanctld -v | grep -qF "$APP_VERSION ($BUILD_NUMBER)"
          test -d "/Applications/清风.app/Contents/MacOS"
          [ "$(sudo /usr/local/bin/fanprobe --report | wc -l | tr -d ' ')" = "19" ]
          (cd "$RUNNER_TEMP/visitor/FanCtl-${APP_VERSION}" && sudo ./uninstall.sh)
          test ! -e /usr/local/libexec/fanctld
          test ! -e "/Applications/清风.app"
          echo "首装→运行→卸载 全链在干净机器上通过（仓库布局 + 访客 zip 布局各一遍）"

      - name: Release 构建
        # R23（P2）：daemon/工具用非 UI 目标直编。App 目标（FanCtlApp）单独一步编译校验
        # （R23 续轮 P3-3：不跑、只编——恢复 PR 阶段对 SelfUpgradeService/FanModel/视图的
        # 编译覆盖，此前只编非 UI 目标会让 App 侧语法/类型回归漏到 tag 触发的 release job
        # 才暴露）。macos runner 始终带完整 Xcode，SwiftUIMacros 插件在场，App 可编。
        run: |
          swift build -c release --disable-sandbox --product fanctld
          swift build -c release --disable-sandbox --product fanprobe
      - name: App 目标编译校验（不跑，仅编）
        run: swift build -c release --disable-sandbox --product FanCtlApp

  # v3.4.5（4A）：tag 推送时打包 dist/ 附到 GitHub Release——访客不必自备
  # Swift 工具链源码编译（第一公里）。产物含 daemon 二进制 + 完整 App bundle +
  # install/uninstall 脚本，按 tag 命名（如 FanCtl-v3.5.0.zip）。
  release:
    name: 打包 Release 附件
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 运行回归测试（tag 也必须全绿才发版）
        run: swift run -c release --disable-sandbox fanctltests

      - name: 发行身份断言（R23：tag == VERSION 主版本）
        # 资产名/Info.plist 由 VERSION 驱动、下载 URL 由 tag 驱动（SelfUpgrade.assetURL）——
        # 两者解耦漂移 = 老用户"检查更新"命中后 404/versionMismatch，全体静默断链
        run: |
          V=$(head -1 VERSION | awk '{print $1}')
          if [ "v${V}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} ≠ VERSION v${V}（打 tag 忘了 bump，或 bump 忘了同步 tag）"
            exit 1
          fi

      - name: 打包（build.sh 从 VERSION 读取版本并组装 App bundle）
        run: ./scripts/build.sh

      - name: 收集发行物
        run: |
          VERSION=$(head -1 VERSION | awk '{print $1}')
          STAGE="FanCtl-${VERSION}"
          mkdir -p "$STAGE"
          cp -R dist/FanCtl.app "$STAGE/"
          cp dist/fanctld "$STAGE/"
          cp dist/fanprobe "$STAGE/"
          cp scripts/install.sh "$STAGE/"
          cp scripts/uninstall.sh "$STAGE/"
          # 批次 A：root 执行脚本随发行物分发——install.sh 把它装进
          # /usr/local/libexec（root:wheel 755），App 只 exec、不携带副本
          cp scripts/upgrade.sh "$STAGE/"
          zip -qr "FanCtl-v${VERSION}.zip" "$STAGE"
          # R40：发行物自证 mode。仓库里掉一次可执行位时，4876 断言 + 62 条门禁 + 构建 + CI
          # 全绿，只有真用户敲 `sudo ./install.sh` 才会 permission denied——所以这道门只看
          # 即将上传的那份 zip（unzip -Z 第一列就是打包进去的权限），不看工作树。
          for _e in install uninstall upgrade; do
            unzip -Z "FanCtl-v${VERSION}.zip" "${STAGE}/${_e}.sh" | grep -q '^.rwxr-xr-x' || { echo "::error::zip 里的 ${_e}.sh 不可执行，首装会 permission denied"; exit 1; }
          done
          echo "zip 内三个 root 脚本均可执行 ✓"
          echo "ASSET=FanCtl-v${VERSION}.zip" >> "$GITHUB_ENV"

      - name: 发布 GitHub Release（gh CLI，第一方工具）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 发行说明取自仓库内 RELEASE-NOTES.md（R37：tag 批注在 CI 上不可靠——
          # actions/checkout 检出 tag 建的是 lightweight 引用，git tag -l --format='%(contents)'
          # 会退化成 commit message，v4.2.1 实测丢了迁移警示）。文件随代码评审、可被静态门检查。
          # 发版号必须严格大于已发布的最大 tag（R39 审查轮）：其余几道门比的都是
          # "tag == VERSION == notes 里的号"，三处一起留旧号（改了代码没提号）时全绿——
          # 只有"新代码贴旧版本号"这条路径没人挡。gh 也拦不住删掉 Release 后重打同号。
          # 整条管道必须写在**一行**里：`$( )` 内的换行是命令终止符，下一行以 `|` 开头
          # 就是 syntax error near unexpected token `|`（v4.2.4 首次发版实测被自己炸红）。
          CUR_TAG="$GITHUB_REF_NAME"
          PREV_TAG=$(git ls-remote --tags origin 2>/dev/null | sed 's@.*refs/tags/@@; s@\^{}$@@' | grep -E '^v[0-9]' | awk -v t="$CUR_TAG" '$0 != t' | sort -V | tail -1)
          if [[ -n "$PREV_TAG" ]] && [[ "$(printf '%s\n%s\n' "$PREV_TAG" "$CUR_TAG" | sort -V | head -1)" == "$CUR_TAG" ]]; then
            echo "::error::tag ${CUR_TAG} 不高于已发布的 ${PREV_TAG}（新代码贴旧版本号 = 同号不同码）"
            exit 1
          fi
          # 说明与 tag 必须同源：notes 是仓库里的固定文件，发版只改 VERSION 而忘了改说明
          # 就会把"上一版的迁移警示"贴到新版本上（这条链上唯一没人复核的一环，故设硬门）
          # 只认"要点行"（- <版本>：），全文匹配会被上一版的警示句蒙过——同号不同
          # build 重发时照样绿，而贴出去的是旧说明
          TAG_V="${GITHUB_REF_NAME#v}"
          TAG_RE=${TAG_V//./\\.}
          if ! grep -qE "^- ${TAG_RE}[：:]" RELEASE-NOTES.md; then
            echo "::error::RELEASE-NOTES.md 缺要点行 - ${TAG_V}：（说明与 tag 不同源，拒绝发布）"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$ASSET" \
            --title "清风 $GITHUB_REF_NAME" \
            --notes-file RELEASE-NOTES.md
