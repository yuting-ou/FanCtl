name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你为项目提出改进建议！请说明它解决的问题，以及你期望的形态。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能/改进解决什么痛点？请描述具体使用场景
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你期望的实现方式（可以模糊，我们会一起细化）
    validations:
      required: false
